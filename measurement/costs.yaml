# Countersign spend ledger: append-only. One row per model call or CI run; never edit a row, add a correction.
# `countersign costs` renders docs/COSTS.md from it. review-llm and adjudicate append rows automatically.
# source: "api usage field" (tokens from the API response) | "estimate" | "unknown". usd: null = not known.
# `changes` (list) marks a run that covered several changes; its cost is split evenly per change in COSTS.md.

prices_usd_per_1m:
  nvidia/nemotron-3.5-super-vl-120b-a12b: {in: 0, out: 0, basis: "NVIDIA API catalog (build.nvidia.com) free tier, rate-limited, not billed"}
  gemini-4-hydrogen: {in: 1.5, out: 7.5, basis: "Google Gemini API list price as charged in the team's Sous runs (13.11.2026)"}

notes:
  - "Codex (OpenAI) runs are billed to Toivo's OpenAI credits; the token counts are the Codex run summaries (docs/CODEX_LOG.md), so source is estimate and usd unknown."
  - "Claude reviews ran in a Renki session on a Claude subscription, not on the hackathon's API credits: there is no per-token bill to attribute."
  - "CRACI CI runs are paid from CRACI's per-team compute credits; rows record the job minutes, usd unknown (see the CRACI dashboard)."
  - "NVIDIA's free tier costs $0 but is capped at about 40 requests per minute."

